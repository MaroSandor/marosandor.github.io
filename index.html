<!DOCTYPE html>
<html lang="hu" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Máró Sándor – Portfolio</title>
  <meta name="description" content="Máró Sándor frontend fejlesztő portfolioja: egy működő terminál és egy élő profilpanel.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Villanásmentes témaválasztás: a CSS betöltése előtt beállítjuk a módot.
    (function () {
      try {
        var p = new URLSearchParams(location.search), d = document.documentElement;
        var m = p.get('mode') || localStorage.getItem('mode');
        var light = matchMedia('(prefers-color-scheme: light)').matches;
        d.dataset.mode = m === 'light' || m === 'dark' ? m : light ? 'light' : 'dark';
      } catch (e) {}
    })();
  </script>
</head>
<body data-view="terminal">
  <header class="top">
    <a class="brand" href="#">máró.sándor<span class="caret">_</span></a>
    <div class="tools">
      <div class="langs" role="group" data-aria-hu="Nyelv" data-aria-en="Language" aria-label="Nyelv">
        <button type="button" data-lang-btn="hu" aria-pressed="true">HU</button>
        <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="mode-btn" id="mode-btn" aria-label="Világos mód">☀</button>
      <div class="tabs" role="group" data-aria-hu="Nézet" data-aria-en="View" aria-label="Nézet">
        <button type="button" data-view-btn="terminal" aria-pressed="true" data-hu="Terminál" data-en="Terminal">Terminál</button>
        <button type="button" data-view-btn="panel" aria-pressed="false" data-hu="Profil" data-en="Profile">Profil</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <section class="termcol">
      <div class="window" id="term" data-aria-hu="Interaktív terminál" data-aria-en="Interactive terminal" aria-label="Interaktív terminál">
        <div class="chrome">
          <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="url">maro.dev <em>· terminal</em></span>
          <span class="spacer"></span>
        </div>
        <div class="out" id="out" role="log" aria-live="polite"></div>
        <form class="prompt" id="form" autocomplete="off" action="#" onsubmit="return false">
          <label id="ps1" for="cmd"></label>
          <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Command">
        </form>
      </div>
      <div class="chips" id="chips" data-aria-hu="Gyorsparancsok" data-aria-en="Quick commands" aria-label="Gyorsparancsok">
        <button type="button" data-run="help">help</button>
        <button type="button" data-run="about">about</button>
        <button type="button" data-run="skills">skills</button>
        <button type="button" data-run="projects">projects</button>
        <button type="button" data-run="repos">repos</button>
        <button type="button" data-run="send">send</button>
        <button type="button" data-run="games">games</button>
      </div>
    </section>

    <aside class="panel" id="panel" aria-label="Profile"></aside>
  </main>

  <noscript><p class="nojs">JavaScript required / A terminálhoz JavaScript kell. <a href="mailto:marosandor2001@gmail.com">marosandor2001@gmail.com</a></p></noscript>
  <script src="data.js"></script>
  <script src="lang.js"></script>
  <script src="theme.js"></script>
  <script src="ascii.js"></script>
  <script src="extras.js"></script>
  <script src="features.js"></script>
  <script src="engine.js"></script>
  <script src="panel.js"></script>
  <script src="main.js"></script>
  <script>
    // Diagnosztika: ha a szkriptek nem töltődtek be, ezt látni fogod a képernyőn.
    window.addEventListener('load', () => {
      const out = document.getElementById('out');
      if (out && !out.children.length) out.textContent = 'Error: the scripts did not load / A szkriptek nem töltődtek be. Open the console (F12) and send me the error.';
    });
  </script>
</body>
</html>
